name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.sdk.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Pick the newest Android platform (Android 17 = API 37)
        id: sdk
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          AV=$($SDKM --list 2>/dev/null | grep -oE "platforms;android-[0-9]+ " | grep -oE "[0-9]+" | sort -n | uniq | tail -1)
          echo "newest platform: $AV"
          for v in $AV 37 36; do
            if $SDKM "platforms;android-$v" > /dev/null 2>&1 && [ -d "$ANDROID_HOME/platforms/android-$v" ]; then SDK=$v; break; fi
          done
          $SDKM "build-tools;36.0.0" > /dev/null 2>&1 || true
          echo "Using compile/target SDK $SDK"
          echo "sdk=$SDK" >> $GITHUB_OUTPUT
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -Ptj.sdk=${{ steps.sdk.outputs.sdk }} --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Check radio stations
        if: success()
        run: python3 tools/check_stations.py || true
      - name: Save APK to the apk branch
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/TomsJukebox-0.9.1-beta.apk
          cp stations_report.txt out/ 2>/dev/null || true
          echo "sdk=${{ steps.sdk.outputs.sdk }} commit=${GITHUB_SHA}" > out/build_info.txt
          cd out && git init -q && git checkout -q -b apk && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p out && cp build.log out/ || true
          cd out && git init -q && git checkout -q -b buildlog && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" buildlog
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apk, path: "app/build/outputs/apk/release/*.apk", if-no-files-found: ignore }

  emulator:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [24, 29, 33, 35, 37]
    steps:
      - uses: actions/checkout@v4
      - name: Get APK
        run: |
          git fetch origin apk --depth 1 && git checkout origin/apk -- TomsJukebox-0.9.1-beta.apk
          mkdir -p app/build/outputs/apk/release && mv TomsJukebox-0.9.1-beta.apk app/build/outputs/apk/release/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 33 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/smoke.sh ${{ matrix.api }}
      - name: Save screenshots
        if: always()
        run: |
          mkdir -p s && cp -r shots/* s/ 2>/dev/null || true
          cd s && git init -q && git checkout -q -b shots-${{ matrix.api }} && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" shots-${{ matrix.api }}
